<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>物理シミュレーション集</title>
<style>
  :root{--bg:#faf7f2;--ink:#1d2433;--sub:#5b6476;--line:#e2ddd3;--card:#fff;--accent:#0060d0}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;line-height:1.5}
  main{max-width:1200px;margin:0 auto;padding:24px 16px 48px}
  h1{font-size:30px;margin:0 0 4px}
  .lead{color:var(--sub);margin:0 0 20px}
  h2{font-size:22px;margin:28px 0 12px;padding-left:10px;border-left:6px solid var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
  .card{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:12px;color:inherit;text-decoration:none;break-inside:avoid}
  .card:hover{border-color:var(--accent)}
  .qr{flex:none;width:118px;height:118px}
  .body{min-width:0}
  .name{font-size:19px;font-weight:700}
  .desc{font-size:14px;color:var(--sub);margin:2px 0 6px}
  .url{font-size:12px;color:var(--accent);word-break:break-all}
  .top{display:flex;gap:16px;align-items:center;justify-content:space-between}
  .top .qr{width:110px;height:110px}
  .self{margin:0;font-size:14px}.self .url{font-size:14px}
  @media print{
    @page{size:A4;margin:12mm}
    body{background:#fff}
    main{padding:0;max-width:none}
    h1{font-size:20pt}
    .top .qr{width:25mm;height:25mm}
    h2{font-size:14pt;margin:10px 0 6px;break-after:avoid}
    .grid{grid-template-columns:repeat(2,1fr);gap:5px}
    .card{border-color:#bbb;padding:5px 8px}
    .qr{width:25mm;height:25mm}
    .name{font-size:12pt}.desc{font-size:9pt}.url{font-size:8pt;color:#000}
  }
</style>
</head>
<body>
<main>
  <header class="top">
    <div>
      <h1>物理シミュレーション集</h1>
      <p class="lead">公開中の {{COUNT}} 本。QRコードを読み取るか、カードを押すと開きます。インストール・ログインは不要です。</p>
      <p class="self">この一覧ページ：<span class="url">{{SELF}}</span></p>
    </div>
    {{SELF_QR}}
  </header>
{{CARDS}}
</main>
</body>
</html>
